receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Kubernetes pod/node/namespace/container tag enrichment
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.container.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection

  # Host name and cloud provider metadata
  resourcedetection:
    detectors: [env, system, gcp]
    timeout: 5s
    override: false

  # Overwrite host.name with k8s.node.name (set by k8sattributes).
  # Without this, Tyk sets host.name to the pod name (kernel hostname),
  # creating fake hosts in Datadog and breaking host tag correlation.
  resource:
    attributes:
      - key: host.name
        from_attribute: k8s.node.name
        action: upsert
      # Ensure container name is always present for infraattributes lookup.
      # Uses insert (not upsert) so k8sattributes value takes precedence.
      - key: k8s.container.name
        value: gateway-tyk-gateway
        action: insert

  # Maps OTel resource attributes to Datadog infrastructure tags
  # Enables host-level correlation in Datadog (host map, infra list)
  infraattributes:
    cardinality: 2

  # Tyk-recommended batch settings
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

exporters:
  datadog:
    api:
      site: ${env:DD_SITE}
      key: ${env:DD_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8sattributes, resourcedetection, resource, infraattributes, batch]
      exporters: [datadog]

# Metrics and logs pipelines intentionally omitted — traces only.

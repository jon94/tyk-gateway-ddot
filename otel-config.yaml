receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Kubernetes pod/node/namespace/container tag enrichment
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.container.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection

  # Host name and cloud provider metadata
  resourcedetection:
    detectors: [env, system, gcp]
    timeout: 5s
    override: false

  # Maps OTel resource attributes to Datadog infrastructure tags
  # Enables host-level correlation in Datadog (host map, infra list)
  infraattributes:
    cardinality: 2

  # Tyk-recommended batch settings
  batch:
    send_batch_max_size: 100
    send_batch_size: 10
    timeout: 10s

exporters:
  datadog:
    api:
      site: ${env:DD_SITE}
      key: ${env:DD_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8sattributes, resourcedetection, infraattributes, batch]
      exporters: [datadog]

# Metrics and logs pipelines intentionally omitted — traces only.

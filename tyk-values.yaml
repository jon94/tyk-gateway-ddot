global:
  redis:
    addrs:
      - redis-master.tyk.svc.cluster.local:6379
    pass: ""
  components:
    pump: true

  # ── Private registry override ─────────────────────────────────────────────
  # Uncomment and set this to pull ALL tyk-oss chart images (gateway + pump)
  # from your private registry instead of docker.tyk.io.
  # Requires the following images to be mirrored into your registry:
  #   docker.tyk.io/tyk-gateway/tyk-gateway:<tag>
  #   docker.tyk.io/tyk-pump/tyk-pump:<tag>
  # imageRegistry: "<YOUR_HARBOR_REGISTRY>"   # e.g. harbor.example.com

tyk-gateway:
  gateway:
    replicaCount: 1
    opentelemetry:
      enabled: true
      exporter: grpc
      endpoint: datadog-otel.datadog.svc.cluster.local:4317
      connectionTimeout: 10
      spanProcessorType: simple
      samplingType: AlwaysOn
      contextPropagation: tracecontext

    extraEnvs:
      - name: OTEL_K8S_POD_UID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: OTEL_K8S_POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "k8s.pod.uid=$(OTEL_K8S_POD_UID),k8s.pod.ip=$(OTEL_K8S_POD_IP),k8s.container.name=gateway-tyk-gateway"

    service:
      type: LoadBalancer
      port: 8080
      targetPort: 8080

# ─── Tyk Pump — Datadog DogStatsD integration ───────────────────────────────
# Sends request-time metrics (tyk.request_time.*) to the Datadog Agent via
# DogStatsD. Requires the Datadog Agent's DogStatsD port to be accessible
# (DD_DOGSTATSD_NON_LOCAL_TRAFFIC: true in the Datadog Helm values).
#
# Metrics emitted:
#   tyk.request_time.avg          Average upstream latency (ms)
#   tyk.request_time.95percentile P95 upstream latency (ms)
#   tyk.request_time.max          Max upstream latency (ms)
#   tyk.request_time.median       Median upstream latency (ms)
#   tyk.request_time.count        Request rate
#
# All metrics are tagged with: method, response_code, api_version, api_name,
# api_id, org_id, tracked, path, oauth_id
tyk-pump:
  pump:
    # ── Private registry override (per-component) ─────────────────────────
    # Use this instead of global.imageRegistry if you only need to override
    # the pump image (e.g. the gateway is already pulled separately).
    # Mirror required: docker.tyk.io/tyk-pump/tyk-pump:v1.14.0
    # image:
    #   repository: "<YOUR_HARBOR_REGISTRY>/tyk-pump/tyk-pump"
    #   tag: v1.14.0
    #   pullPolicy: IfNotPresent

    # ── Image pull secret ─────────────────────────────────────────────────
    # Required if your private registry needs authentication.
    # Create the secret first:
    #   kubectl create secret docker-registry regcred \
    #     --docker-server=<YOUR_HARBOR_REGISTRY> \
    #     --docker-username=<USER> \
    #     --docker-password=<PASSWORD> \
    #     -n tyk
    # imagePullSecrets:
    #   - name: regcred

    backend:
      - "dogstatsd"
    extraEnvs:
      - name: TYK_PMP_PUMPS_DOGSTATSD_TYPE
        value: "dogstatsd"
      - name: TYK_PMP_PUMPS_DOGSTATSD_META_ADDRESS
        value: "datadog-agent.datadog.svc.cluster.local:8125"
      - name: TYK_PMP_PUMPS_DOGSTATSD_META_NAMESPACE
        value: "tyk"
      - name: TYK_PMP_PUMPS_DOGSTATSD_META_SAMPLERATE
        value: "0.9999999999"
      - name: TYK_PMP_PUMPS_DOGSTATSD_META_BUFFERED
        value: "true"
      - name: TYK_PMP_PUMPS_DOGSTATSD_META_BUFFEREDMAXMESSAGES
        value: "32"
      - name: TYK_PMP_PUMPS_DOGSTATSD_META_TAGS
        value: "method,response_code,api_version,api_name,api_id,org_id,tracked,path,oauth_id"

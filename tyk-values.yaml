global:
  redis:
    addrs:
      - redis-master.tyk.svc.cluster.local:6379
    pass: ""

tyk-gateway:
  gateway:
    replicaCount: 1
    opentelemetry:
      enabled: true
      exporter: grpc
      endpoint: datadog-otel.datadog.svc.cluster.local:4317
      connectionTimeout: 10
      spanProcessorType: simple
      samplingType: AlwaysOn
      contextPropagation: tracecontext

    extraEnvs:
      # Downward API — expose pod and node identity to the OTel SDK
      - name: OTEL_K8S_POD_UID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: OTEL_K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      # k8s.node.name is used by the Datadog exporter as the hostname,
      # enabling host tag correlation from the Datadog Agent on that node.
      # k8s.pod.uid + k8s.container.name satisfy the infraattributes processor.
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "k8s.pod.uid=$(OTEL_K8S_POD_UID),k8s.container.name=gateway-tyk-gateway,k8s.node.name=$(OTEL_K8S_NODE_NAME)"

    service:
      type: LoadBalancer
      port: 8080
      targetPort: 8080

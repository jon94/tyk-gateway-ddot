global:
  redis:
    addrs:
      - redis-master.tyk.svc.cluster.local:6379
    pass: ""

tyk-gateway:
  gateway:
    replicaCount: 1
    opentelemetry:
      enabled: true
      exporter: grpc
      endpoint: datadog-otel.datadog.svc.cluster.local:4317
      connectionTimeout: 10
      spanProcessorType: simple
      samplingType: AlwaysOn
      contextPropagation: tracecontext

    extraEnvs:
      - name: OTEL_SERVICE_NAME
        value: tyk-gateway
      - name: OTEL_K8S_NAMESPACE
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: metadata.namespace
      - name: OTEL_K8S_NODE_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: spec.nodeName
      - name: OTEL_K8S_POD_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: metadata.name
      - name: OTEL_K8S_POD_ID
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: metadata.uid
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: >-
          service.name=$(OTEL_SERVICE_NAME),
          k8s.namespace.name=$(OTEL_K8S_NAMESPACE),
          k8s.node.name=$(OTEL_K8S_NODE_NAME),
          k8s.pod.name=$(OTEL_K8S_POD_NAME),
          k8s.pod.uid=$(OTEL_K8S_POD_ID),
          k8s.container.name=gateway-tyk-gateway,
          host.name=$(OTEL_K8S_NODE_NAME),
          deployment.environment.name=$(OTEL_K8S_NAMESPACE)

    service:
      type: LoadBalancer
      port: 8080
      targetPort: 8080
